[paths]
# Папка с URL-источниками (большой пул и временные сгенерированные файлы).
files_dir = urls

[api]
# Локальный HTTP-API Linken Sphere 2 (Settings → Network → API port).
base_url = http://127.0.0.1:36555
# Источник URL'ов: один большой файл, из которого случайно выбираем
# набор URL на каждый запуск (используется и в API-флоу, и в UI-флоу).
url_pool_file = urls/40k_all_urls.txt
# Сколько URL'ов взять за один scheduled-запуск.
urls_per_run_min = 95
urls_per_run_max = 100
# СУММАРНАЯ цель прогрева. На первой инсталляции random.randint(min, max)
# выбирается один раз и пишется в .warmup_target. Каждый успешный запуск
# прибавляет реально прогретые URL'ы в .warmup_count. Когда count >= target
# → ntfy "all jobs done" + автоматический schtasks /disable.
urls_total_target_min = 300
urls_total_target_max = 500
# LS API валидатор не принимает большие массивы — выдаёт
# 'array has too many items' уже на ~99 URL за вызов. Поэтому режем
# выбранные URL на чанки по urls_per_chunk_max и шлём ПОСЛЕДОВАТЕЛЬНО.
#
# Эволюция значения:
#   7  → дефолт из официальной LS-доки, гарантированно проходит
#   14 → текущее. Эмпирическое: на парке 10+ VPS на одном LS-аккаунте
#        половина API calls = половина шансов на 409 'Session is used'
#        collision между VPS. Total цикл ~36 мин (vs 37 мин на 7 URL) —
#        НЕ медленнее, потому что прогреваем тот же объём. Просто меньше
#        round-trip overhead. poll_timeout 600с легко покрывает один
#        чанк (14 URL × view_depth 3 × 7с ≈ 294с теоретики + buffer).
urls_per_chunk_max = 14
# Пауза между чанками (даём LS отдышаться и закрыть состояние).
# 3с было мало — иногда ловили HTTP 409 'Session is used by another client
# or operation' (LS ещё закрывает браузерные вкладки предыдущего чанка).
# 10с надёжнее. Плюс на 409 теперь работает retry с backoff 15/30с.
pause_between_chunks_seconds = 10
# Поллинг состояния сессии после старта прогрева одного чанка.
poll_interval_seconds = 5
# Таймаут поллинга на ОДИН чанк (не на весь запуск). 7 URL × ~7s × view
# = пара минут, ставим 10 мин на запас.
poll_timeout_seconds = 600
# Сетевой таймаут HTTP-запроса. 30с (вместо 15) — на случай когда
# Chromium-renderer внутри LS залип на тяжёлой странице (heavy JS,
# autoplay video, ad-network) и main API-thread не успевает ответить
# за 15с. Localhost-вызов в норме <100мс, увеличение лимита не
# замедляет успешные кейсы, только переживает CPU contention.
http_timeout_seconds = 30

[startup]
# Путь к Linken Sphere 2 (.exe или .lnk).
linken_sphere_path = C:\Program Files (x86)\Linken Sphere 2\Linken Sphere 2.exe
# Сколько секунд ждать появления главного экрана после запуска.
# На 2-ядерных VPS Electron поднимается медленнее — берём с запасом.
# 240с (а не 120): запас на медленную "Loading desktop data..." фазу
# когда LS дотягивает state с ls.app cloud + параллельно firewall watcher
# крутится и дисмиссит Defender popup'ы для chromium subprocess'ов.
launch_wait_seconds = 240

[warmup]
# Целевые абсолютные значения steppers
viewing_depth = 3
viewing_depth_min = 1
time_per_url = 7
time_per_url_min = 0
# Сколько раз кликнуть "-" чтобы гарантированно сбросить до минимума
reset_clicks = 25
# Снимать ли галочку use most popular
uncheck_use_most_popular = true
# Удалить первые N строк из URL textarea после загрузки файла (0 = ничего не удалять)
remove_first_n_lines = 7

[url_list_offset]
# Куда кликать относительно центра BROWSE FILE, чтобы попасть в URL-textarea.
dx_from_browse = -400
dy_from_browse = 120

[stepper_offsets]
# Куда кликать внутри найденного шаблона поля-stepper'а.
# Значения 0..1 — доля от ширины/высоты шаблона.
# В кропах часто есть запас фона справа, поэтому "+" не на 0.93, а ближе.
plus_x = 0.87
minus_x = 0.58
y_center = 0.5

[checkbox_offset]
# Toggle-переключатель "use most popular" — слева в шаблоне.
toggle_x = 0.08
toggle_y = 0.5

[matching]
# Порог совпадения шаблона (0..1). Выше — строже.
confidence = 0.80
# Сколько секунд ждать появления каждого элемента. На 2-ядерных VPS
# multi-scale template matching сам по себе занимает 1-3с за попытку,
# поэтому таймаут нужен с запасом.
wait_seconds = 30
# Пауза между шагами (сек) — чтобы UI успевал отрисоваться. Electron
# на слабой видеокарте перерисовывается заметно дольше.
step_delay = 1.5

[logging]
# Делать ли скриншот после каждого шага в screenshots/
screenshots = true
